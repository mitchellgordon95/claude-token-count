name: burn
on:
  schedule:
    - cron: '0 10 * * 0'     # weekly partial burn, Sunday 10:00 UTC
    - cron: '0 10 1 * *'     # monthly full burn, 1st of the month 10:00 UTC
  workflow_dispatch:
    inputs:
      mode: { description: 'output | input | cache', default: 'output' }
      model: { description: 'model alias', default: 'sonnet' }
      target_pct: { description: 'stop after the 5h meter rises this much', default: '10' }
      until_limit: { description: 'true = burn until rate-limited (full burn)', default: 'false' }
      label: { description: 'label for this run', default: 'manual' }
concurrency: burn
jobs:
  burn:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code
      - name: decide parameters
        id: p
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 10 1 * *" ]; then
            echo "args=--mode output --until-limit --label monthly-full" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "args=--mode output --target-pct 10 --label weekly" >> $GITHUB_OUTPUT
          else
            UL=""; [ "${{ inputs.until_limit }}" = "true" ] && UL="--until-limit"
            echo "args=--mode ${{ inputs.mode }} --model ${{ inputs.model }} --target-pct ${{ inputs.target_pct }} $UL --label ${{ inputs.label }}" >> $GITHUB_OUTPUT
          fi
      - name: burn
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node burn/burn.mjs ${{ steps.p.outputs.args }} --concurrency 2
      - name: commit results
        run: |
          git config user.name "burn-bot"
          git config user.email "burn-bot@users.noreply.github.com"
          git add data
          git commit -m "burn: $(date -u +%Y-%m-%dT%H:%MZ) ${{ steps.p.outputs.args }}" || exit 0
          git pull --rebase
          git push
